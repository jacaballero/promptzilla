services:
  web:
    build: .
    ports:
      # Host port is configurable via WEB_PORT in .env (defaults to 8080).
      - "${WEB_PORT:-8080}:80"
    environment:
      # External LLM backend the proxy forwards the API path to (host:port).
      # Point it at your Ollama (e.g. host:11434) or vLLM (e.g. host:8002),
      # matching the provider set in config.js. Set LLM_UPSTREAM in .env.
      - LLM_UPSTREAM=${LLM_UPSTREAM:-127.0.0.1:11434}
    volumes:
      # Production config (relative endpoint "/api/generate"). Copy
      # config.prod.example.js to config.js and edit model/endpoint.
      - ./config.js:/srv/config.js:ro
    restart: unless-stopped
    # If this container runs on the SAME host as the LLM backend (Linux), use
    # instead:
    #   extra_hosts: ["host.docker.internal:host-gateway"]
    # and set LLM_UPSTREAM=host.docker.internal:11434
