<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promptzilla — Aventura</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="adventure">

<!-- ── Start screen (preloads every image before the game starts) ─────────── -->
<div id="start-screen">
  <div class="start-card">
    <div id="start-lang" class="start-lang"></div>
    <img class="start-logo" src="assets/logos/promptzilla-lime.png" alt="Promptzilla">
    <p class="start-intro" data-i18n="start.intro"></p>
    <ul class="start-rules">
      <li data-i18n="start.rule.move"></li>
      <li data-i18n="start.rule.challenges"></li>
      <li data-i18n="start.rule.tokens"></li>
      <li data-i18n="start.rule.once"></li>
      <li id="start-report-rule" data-i18n="start.rule.report"></li>
    </ul>
    <div id="start-xapi-rule" class="start-privacy" role="note">
      <strong data-i18n="start.privacy.title"></strong>
      <p data-i18n="start.privacy.text"></p>
    </div>
    <div class="start-progress"><div id="start-bar"></div></div>
    <p id="start-status" data-i18n="start.loading"></p>
    <button id="start-btn" class="btn-primary" disabled data-i18n="start.loading"></button>
  </div>
</div>

<div id="game">

  <!-- ── HUD ──────────────────────────────────────────────────────────────── -->
  <header id="hud">
    <span id="hud-title"><img src="assets/logos/promptzilla-lime.png" alt="Promptzilla"></span>
    <span id="hud-tokens">150 / 150 tokens</span>
  </header>

  <!-- ── Stage (scene is built here by the engine) ────────────────────────── -->
  <div id="stage-wrap">
    <div id="stage"></div>
    <div id="hover-name"></div>
    <div id="caption"></div>
    <div id="say-bar" style="display:none"></div>
    <!-- Dialogue overlays the lower part of the scene (does not shift the layout) -->
    <div id="dialogue-box" style="display:none"></div>
  </div>

</div>

<!-- Logic data & config (JSON data is fetched by boot.js) -->
<script src="dialogues.data.js"></script>
<script src="logo.data.js"></script>
<script src="config.default.js"></script>
<script src="config.js"></script><!-- optional local override; 404 if absent is fine -->
<script src="boot.js"></script>
<!-- Modules -->
<script src="i18n.js"></script>
<script src="xapi.js"></script>
<script src="llm.js"></script>
<script src="eval.js"></script>
<script src="challenge.js"></script>
<script src="engine.js"></script>
</body>
</html>
