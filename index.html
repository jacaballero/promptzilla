<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promptzilla — Aventura</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="adventure">

<div id="game">

  <!-- ── HUD ──────────────────────────────────────────────────────────────── -->
  <header id="hud">
    <span id="hud-title">PROMPTZILLA</span>
    <span id="hud-tokens">⚡ 100 / 100 tokens</span>
  </header>

  <!-- ── Stage (scene is built here by the engine) ────────────────────────── -->
  <div id="stage-wrap">
    <div id="stage"></div>
    <div id="hover-name"></div>
    <div id="caption"></div>
    <div id="say-bar" style="display:none"></div>
    <!-- Dialogue overlays the lower part of the scene (does not shift the layout) -->
    <div id="dialogue-box" style="display:none"></div>
  </div>

</div>

<!-- Data & config (plain globals, work over file:// and HTTP) -->
<script src="scenes.data.js"></script>
<script src="dialogues.data.js"></script>
<script src="content.js"></script>
<script src="config.default.js"></script>
<script src="config.js"></script><!-- optional local override; 404 if absent is fine -->
<script src="boot.js"></script>
<!-- Modules -->
<script src="llm.js"></script>
<script src="challenge.js"></script>
<script src="engine.js"></script>
</body>
</html>
